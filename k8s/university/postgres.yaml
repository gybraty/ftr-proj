apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: university
data:
  01-replicator.sql: |
    CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'replpass';
  02-hba.sh: |
    #!/bin/bash
    echo "host replication replicator 0.0.0.0/0 md5" >> "$PGDATA/pg_hba.conf"
---
# Stable DNS for pg_basebackup source: postgres-primary-0.postgres-primary-hl
apiVersion: v1
kind: Service
metadata: { name: postgres-primary-hl, namespace: university }
spec:
  clusterIP: None
  selector: { app: postgres, role: primary }
  ports: [{ port: 5432 }]
---
# Switchable endpoint: failover flips the db-active label between pods
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: university }
spec:
  selector: { app: postgres, db-active: "true" }
  ports: [{ port: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres-primary-direct, namespace: university }
spec:
  type: NodePort
  selector: { app: postgres, role: primary }
  ports: [{ port: 5432, targetPort: 5432, nodePort: 30432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres-replica-svc, namespace: university }
spec:
  clusterIP: None
  selector: { app: postgres, role: replica }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: university
  labels: { app: postgres, role: primary }
spec:
  serviceName: postgres-primary-hl
  replicas: 1
  selector: { matchLabels: { app: postgres, role: primary } }
  template:
    metadata:
      labels: { app: postgres, role: primary, db-active: "true" }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: postgres }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: postgres
          image: postgres:16
          args: ["-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "hot_standby=on"]
          env:
            - { name: POSTGRES_USER, value: ftr }
            - { name: POSTGRES_PASSWORD, value: ftr }
            - { name: POSTGRES_DB, value: university }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "ftr", "-d", "university"] }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data, labels: { app: postgres } }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: university
  labels: { app: postgres, role: replica }
spec:
  serviceName: postgres-replica-svc
  replicas: 1
  selector: { matchLabels: { app: postgres, role: replica } }
  template:
    metadata:
      labels: { app: postgres, role: replica }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: postgres }
                topologyKey: kubernetes.io/hostname
      securityContext: { fsGroup: 999 }
      initContainers:
        - name: basebackup
          image: postgres:16
          securityContext: { runAsUser: 999 }
          command: ["bash", "-c"]
          args:
            - |
              D=/var/lib/postgresql/data/pgdata
              [ -s "$D/PG_VERSION" ] && [ -f "$D/standby.signal" ] && exit 0
              until PGPASSWORD=replpass pg_basebackup -h postgres-primary-0.postgres-primary-hl.university.svc -U replicator -D $D -R -X stream; do
                echo "waiting for primary"; rm -rf $D; sleep 3
              done
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_USER, value: ftr }
            - { name: POSTGRES_PASSWORD, value: ftr }
            - { name: POSTGRES_DB, value: university }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "ftr", "-d", "university"] }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data, labels: { app: postgres } }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }

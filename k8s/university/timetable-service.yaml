apiVersion: apps/v1
kind: Deployment
metadata:
  name: timetable-service
  namespace: university
  labels: { app: timetable-service, ftr-chaos-target: "true" }
spec:
  selector: { matchLabels: { app: timetable-service } }
  template:
    metadata:
      labels: { app: timetable-service, ftr-chaos-target: "true" }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      terminationGracePeriodSeconds: 5
      containers:
        - name: timetable-service
          image: ftr/timetable-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3004 }]
          env:
            - { name: PORT, value: "3004" }
            - { name: DATABASE_URL, value: "postgres://ftr:ftr@postgres.university.svc:5432/university" }
            - { name: FT_MODE, value: "on" }
            - name: CHAOS_TOKEN
              valueFrom: { secretKeyRef: { name: chaos-token, key: token } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet: { path: /ready, port: 3004 }
            periodSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata: { name: timetable-service, namespace: university }
spec:
  type: NodePort
  selector: { app: timetable-service }
  ports: [{ port: 3004, targetPort: 3004, nodePort: 30004 }]

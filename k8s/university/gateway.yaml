apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: university
  labels: { app: gateway, ftr-chaos-target: "true" }
spec:
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway, ftr-chaos-target: "true" }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      terminationGracePeriodSeconds: 5
      containers:
        - name: gateway
          image: ftr/gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - { name: DATABASE_URL, value: "postgres://ftr:ftr@postgres.university.svc:5432/university" }
            - { name: FT_MODE, value: "on" }
            - { name: STUDENT_URL, value: "http://student-service.university.svc:3001" }
            - { name: PAYMENT_URL, value: "http://payment-service.university.svc:3002" }
            - { name: RECORDS_URL, value: "http://records-service.university.svc:3003" }
            - { name: TIMETABLE_URL, value: "http://timetable-service.university.svc:3004" }
            - name: CHAOS_TOKEN
              valueFrom: { secretKeyRef: { name: chaos-token, key: token } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: university }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30080 }]
